name: Publicar aplicativo Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validar versão da tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $source = Get-Content "agape_app\version.py" -Raw
          if ($source -notmatch "APP_VERSION\s*=\s*`"$([regex]::Escape($version))`"") {
            throw "APP_VERSION não corresponde à tag ${{ github.ref_name }}."
          }

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Gerar aplicativo
        run: python -m PyInstaller --noconfirm ClinicaAgape.spec

      - name: Incluir configuração pública do Supabase
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_ANON_KEY) {
            throw "Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
          }
          @"
          SUPABASE_URL=$env:SUPABASE_URL
          SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY
          "@ | Set-Content "dist\ClinicaAgape\.env" -Encoding utf8

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer.iss

      - name: Gerar checksum
        shell: pwsh
        run: |
          $file = "release\ClinicaAgape-Setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  ClinicaAgape-Setup.exe" | Set-Content "$file.sha256" -Encoding ascii

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/ClinicaAgape-Setup.exe release/ClinicaAgape-Setup.exe.sha256 --generate-notes --title "Clínica Ágape ${{ github.ref_name }}"
